# One environment for the whole repo: OT-2 protocol simulation, bo_bridge, SDL_BO and the analysis code.
#   mamba env create -f environment.yml
#   mamba activate sdlhack
name: sdlhack
channels:
  - conda-forge
dependencies:
  - python=3.12        # opentrons 8.8.2 (last series that simulates OT-2 protocols) needs 3.10-3.12
  - pip
  - pytest
  - pip:
      - opentrons==8.8.2
      - numpy
      - pandas
      - scipy
      - scikit-learn
      - matplotlib
